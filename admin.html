<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal CRM Stock V8</title>
<style>
body{margin:0;background:#060914;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial}
.card{background:#10192b;border:1px solid #ffffff18;border-radius:22px;padding:16px;margin:12px}
button{border:0;border-radius:14px;padding:12px 14px;background:linear-gradient(135deg,#d8c276,#74b9ff);font-weight:900;color:#071022}
input{width:100%;background:#071022;color:white;border:1px solid #ffffff18;border-radius:14px;padding:13px}
.hidden{display:none}.row{background:#10182a;border:1px solid #ffffff18;border-radius:16px;padding:12px;margin:8px 0}.mut{color:#9daabe}
</style>
</head>
<body>
<div id="auth" class="card">
<h1>Royal CRM Stock V8</h1>
<p class="mut">Stock base + proveedores listos para importar.</p>
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()" style="margin-top:10px">Entrar</button>
</div>
<div id="app" class="hidden">
<div class="card">
<h2>Stock base preparado</h2>
<p class="mut">Esta versión trae el archivo <b>stock-seed.json</b> para subir proveedores, costos y precio público inicial.</p>
<button onclick="importStock()">Importar stock base a Firebase</button>
</div>
<div class="card"><h2>Vista rápida</h2><div id="list"></div></div>
</div>
<script>
const DB='https://legacy-royal-stream-d2d38-default-rtdb.firebaseio.com/api';
async function api(path,method='GET',body=null){let opt={method,headers:{'Content-Type':'application/json'}};if(body)opt.body=JSON.stringify(body);let r=await fetch(DB+'/'+path+'.json',opt);return r.json()}
function login(){if(pass.value!=='royal2026')return alert('Contraseña incorrecta');auth.classList.add('hidden');app.classList.remove('hidden');render()}
async function importStock(){
 const seed=await fetch('stock-seed.json').then(r=>r.json());
 const proveedores={};
 Object.values(seed.proveedores).forEach(p=>{
   Object.entries(p.productos).forEach(([producto,mods])=>{
     Object.entries(mods).forEach(([modalidad,durs])=>{
       Object.entries(durs).forEach(([duracion,costo])=>{
         const id=(p.nombre+'_'+producto+'_'+modalidad+'_'+duracion).toLowerCase().replace(/[^a-z0-9]+/g,'_');
         proveedores[id]={id,nombre:p.nombre,producto,modalidad,duracion,costoBase:Number(costo)||0,queVende:producto,tiempoEntrega:'Variable',horarioActivo:'Variable',metodoDisponibilidad:'WhatsApp'};
       });
     });
   });
 });
 const precios={};
 Object.entries(seed.preciosPublicos).forEach(([k,v])=>precios[k.replaceAll('/','-').replaceAll('.','')]={key:k,precio:v});
 await api('proveedores','PATCH',proveedores);
 await api('precios','PATCH',precios);
 alert('Stock base importado.');
 render();
}
async function render(){
 const seed=await fetch('stock-seed.json').then(r=>r.json());
 list.innerHTML=Object.values(seed.proveedores).map(p=>'<div class=row><b>'+p.nombre+'</b><br><span class=mut>'+Object.keys(p.productos).join(', ')+'</span></div>').join('');
}
</script>
</body></html>

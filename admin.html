<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal CRM + API V5</title>
<style>
body{margin:0;background:#060914;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.hidden{display:none!important}
.card{background:#10192b;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px;margin:12px}
button{border:0;border-radius:13px;padding:11px 13px;background:#7b3cff;color:white;font-weight:800}
input,select,textarea{width:100%;background:#071022;color:white;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:11px}
label{font-size:11px;color:#9aa8bd;text-transform:uppercase;display:block;margin-top:8px}
.nav{display:flex;gap:8px;overflow:auto;padding:12px;position:sticky;top:0;background:#060914}
.nav button{white-space:nowrap;background:#19243a}
.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ficha{white-space:pre-wrap;background:#060b17;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;font-family:monospace;font-size:12px}
.row{padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:14px;margin:8px 0;background:#0b1222}
</style>
</head>
<body>
<div id="auth" class="card">
<h2>Royal CRM + API V5</h2>
<label>Contraseña</label><input id="pass" type="password">
<button onclick="login()" style="margin-top:10px;width:100%">Entrar</button>
</div>

<div id="app" class="hidden">
<div class="nav">
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('venta')">Nueva venta</button>
<button onclick="show('clientes')">Clientes</button>
<button onclick="show('pedidos')">Pedidos</button>
<button onclick="show('api')">API</button>
</div>

<section id="dashboard" class="section active"><div class="card"><h2>Centro de Operaciones</h2><div id="dash"></div></div></section>

<section id="venta" class="section">
<div class="card">
<h2>Nueva venta</h2>
<div class="grid">
<div><label>Nombre</label><input id="nombre" value="Samuel CV"></div>
<div><label>WhatsApp</label><input id="whatsapp" value="525619244751"></div>
<div><label>Folio</label><input id="folio"><button onclick="genFolio()">Generar</button></div>
<div><label>Categoría</label><select id="categoria" onchange="loadProducts()"><option>Streaming</option><option>Trámites</option><option>Pago servicios</option><option>Seguidores</option></select></div>
<div><label>Producto</label><select id="producto" onchange="loadModalidades()"></select></div>
<div><label>Modalidad</label><select id="modalidad" onchange="updateFicha()"></select></div>
<div><label>Duración</label><select id="duracion" onchange="updateFicha()"><option>1M</option><option selected>2M</option><option>3M</option></select></div>
<div><label>Proveedor</label><select id="proveedor" onchange="setCosto()"><option>DULITA</option><option>DARDO</option><option>COMODÍN</option></select></div>
<div><label>Costo proveedor</label><input id="costo" readonly></div>
<div><label>Monto recibido</label><input id="monto" type="number" value="100"></div>
<div><label>Estado</label><select id="estado"><option>No entregado</option><option>Entregado</option></select></div>
<div><label>Fecha entrega</label><input id="entrega" type="date" onchange="updateFicha()"></div>
<div><label>Fecha vencimiento</label><input id="vencimiento" type="date" onchange="updateFicha()"></div>
</div>
<label>Foto pago</label><input id="fotoPago" type="file" accept="image/*" capture="environment">
<label>Foto garantía</label><input id="fotoGarantia" type="file" accept="image/*" capture="environment">
</div>
<div class="card">
<h2>Ficha de entrega</h2><div id="ficha" class="ficha"></div>
<button onclick="copyFicha()">Copiar</button>
<button onclick="sendWA()">Enviar WhatsApp</button>
<button onclick="saveSale()">Guardar en API</button>
</div>
</section>

<section id="clientes" class="section"><div class="card"><h2>Clientes</h2><div id="clientes"></div></div></section>
<section id="pedidos" class="section"><div class="card"><h2>Pedidos</h2><div id="pedidos"></div></div></section>
<section id="api" class="section"><div class="card"><h2>API</h2><div class="ficha">/api/clientes
/api/pedidos
/api/garantias
/api/catalogo
/api/proveedores

Garantía:
1M = 25 días
2M = 50 días
3M = 75 días</div></div></section>
</div>

<script>
const DB='https://legacy-royal-stream-d2d38-default-rtdb.firebaseio.com/api';
const productos={Streaming:['YouTube Premium','Spotify Premium','Netflix','Disney+','Max / HBO Max'],Trámites:['Acta de nacimiento'], 'Pago servicios':['Pago de servicio'], Seguidores:['Seguidores Instagram']};
function login(){if(pass.value!=='royal2026')return alert('Contraseña incorrecta');auth.classList.add('hidden');app.classList.remove('hidden');init();}
function show(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');render();}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){if(!d)return'';let [y,m,da]=d.split('-');return `${da}-${m}-${y.slice(2)}`}
function meses(){return Number((duracion.value||'1M').replace(/\D/g,''))||1}
function garantiaDias(){return meses()*25}
function genFolio(){let d=new Date(), y=String(d.getFullYear()).slice(2), m=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0'); folio.value=`YT-${y}${m}${da}-001`;updateFicha()}
function loadProducts(){producto.innerHTML=productos[categoria.value].map(x=>`<option>${x}</option>`).join('');loadModalidades()}
function loadModalidades(){let p=producto.value;if(p.includes('YouTube')||p.includes('Spotify'))modalidad.innerHTML='<option>Individual Correo nuevo</option><option>Individual Invitación</option><option>Familiar</option>';else if(categoria.value==='Streaming')modalidad.innerHTML='<option>Perfil</option><option>Cuenta completa</option><option>Invitación</option>';else modalidad.innerHTML='<option>Servicio</option>';setCosto();updateFicha()}
function setCosto(){let p=producto.value,m=meses(); if(p.includes('YouTube')&&proveedor.value==='DULITA')costo.value='$'+(15*m); else costo.value='Según proveedor';updateFicha()}
function servicio(){let p=producto.value,d=duracion.value,mod=modalidad.value;if(p.includes('YouTube')&&mod.includes('Correo'))return 'YouTube Premium Individual '+d;if(p.includes('Spotify')&&mod.includes('Correo'))return 'Spotify Premium Individual '+d;return `${p} ${mod} ${d}`.trim()}
function acceso(){let mod=modalidad.value;if(mod.includes('Correo'))return 'Correo nuevo';if(mod.includes('Invitación'))return 'Invitación';if(mod.includes('Familiar'))return 'Familiar';return mod}
function updateFicha(){ficha.textContent=`*📌 FICHA DE ENTREGA*

📱 Servicio: ${servicio()}
👥 Acceso asignado: ${acceso()}
📅 Fecha de entrega: ${fmt(entrega.value)}
📅 Fecha de vencimiento: ${fmt(vencimiento.value)}
🛡️ Garantía: ${garantiaDias()} días

*⚠️ POLÍTICAS Y CONDICIONES*

✅ La cuenta se entrega funcionando correctamente.
✅ El cliente cuenta con *1 hora a partir de la entrega* para verificar el acceso y confirmar que quedó funcionando; de lo contrario, se dará por recibida y aceptada y la garantía quedará anulada.
🚫 No cambiar contraseña ni configuración de la cuenta.
🚫 No compartir el acceso con más personas o dispositivos no autorizados.

*🔄 En caso de caída, bloqueo o cierre de sesión, la reposición o solución puede tardar hasta 72 horas.*

📌 Al recibir la cuenta, aceptas estas políticas y condiciones.`}
function copyFicha(){navigator.clipboard.writeText(ficha.textContent);alert('Ficha copiada')}
function sendWA(){estado.value='Entregado';window.open('https://wa.me/'+whatsapp.value+'?text='+encodeURIComponent(ficha.textContent),'_blank')}
async function img64(id){let f=document.getElementById(id).files[0];if(!f)return'';return new Promise(r=>{let rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(f)})}
async function api(path,method='GET',body=null){let opt={method,headers:{'Content-Type':'application/json'}};if(body)opt.body=JSON.stringify(body);let res=await fetch(DB+'/'+path+'.json',opt);return res.json()}
async function saveSale(){if(!fotoGarantia.files[0])return alert('Sube foto de garantía para guardar definitivo');if(!fotoPago.files[0])return alert('Sube foto de pago');if(!folio.value)genFolio();let pedido={folio:folio.value,cliente:nombre.value,whatsapp:whatsapp.value,producto:producto.value,modalidad:modalidad.value,duracion:duracion.value,montoRecibido:Number(monto.value||0),costoProveedor:Number(costo.value.replace(/\D/g,''))||0,proveedorUsado:proveedor.value,estado:estado.value,fecha:entrega.value,vencimiento:vencimiento.value,diasGarantia:garantiaDias(),fichaEntrega:ficha.textContent,comprobantePago:await img64('fotoPago'),fotoGarantia:await img64('fotoGarantia')};await api('clientes/'+whatsapp.value,'PATCH',{nombre:nombre.value,whatsapp:whatsapp.value,nivelConfianza:'nuevo'});await api('pedidos/'+folio.value,'PUT',pedido);await api('garantias/'+folio.value,'PUT',{folio:folio.value,whatsapp:whatsapp.value,estado:'Activa',diasGarantia:garantiaDias(),fotoGarantia:pedido.fotoGarantia});alert('Guardado en API');render()}
async function render(){let c=await api('clientes')||{}, p=await api('pedidos')||{};dash.innerHTML=`Clientes: ${Object.keys(c).length}<br>Pedidos: ${Object.keys(p).length}`;clientes.innerHTML=Object.values(c).map(x=>`<div class=row><b>${x.nombre}</b><br>${x.whatsapp}</div>`).join('')||'Sin clientes';pedidos.innerHTML=Object.values(p).map(x=>`<div class=row><b>${x.folio}</b><br>${x.cliente} · ${x.producto} · Garantía ${x.diasGarantia} días</div>`).join('')||'Sin pedidos'}
function init(){entrega.value=today();loadProducts();genFolio();render()}
</script>
</body></html>

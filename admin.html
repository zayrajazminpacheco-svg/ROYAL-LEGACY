<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Royal CRM + API V6</title>
<style>
:root{
 --bg:#060914;--panel:#0d1425;--card:#111b30;--soft:#17233b;--line:rgba(255,255,255,.10);
 --txt:#f8fbff;--mut:#9daabe;--gold:#d8c276;--blue:#74b9ff;--green:#22d47b;--red:#ff5364;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top left,rgba(216,194,118,.12),transparent 28%),linear-gradient(180deg,#050816,#080d18);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button{border:0;border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,var(--gold),var(--blue));color:#071022;font-weight:900;font-size:14px}
button.ghost{background:#162039;color:white;border:1px solid var(--line)}
button.danger{background:linear-gradient(135deg,#ff5364,#8b1220);color:white}
input,select,textarea{width:100%;background:#071022;color:white;border:1px solid var(--line);border-radius:16px;padding:14px;font-size:16px;outline:none}
input[readonly]{color:#b8c4d6;background:#10182a}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 6px;font-weight:700}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px}
.app{display:none;min-height:100vh}
.header{position:sticky;top:0;z-index:10;background:rgba(6,9,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#d8c276,#74b9ff);display:grid;place-items:center;font-size:30px}
.brand h1{font-size:22px;line-height:1.05;margin:0}
.brand small{color:var(--mut);font-weight:700}
.tabs{display:flex;gap:8px;overflow:auto;padding-top:13px}
.tabs button{white-space:nowrap;background:#162039;color:white;border:1px solid var(--line);padding:11px 14px}
.tabs button.active{background:linear-gradient(135deg,var(--gold),var(--blue));color:#071022}
.main{padding:14px 14px 70px;max-width:900px;margin:auto}
.section{display:none}.section.active{display:block}
.card{background:linear-gradient(180deg,#111b30,#0d1425);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.card h2{font-size:28px;margin:0 0 12px}
.card h3{margin:0 0 10px;font-size:21px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#10182a;border:1px solid var(--line);border-radius:20px;padding:15px}
.kpi span{color:var(--mut);font-size:12px;font-weight:800}
.kpi b{display:block;font-size:28px;margin-top:4px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.row{background:#10182a;border:1px solid var(--line);border-radius:18px;padding:13px;margin:8px 0}
.row b{font-size:16px}
.row small{color:var(--mut)}
.ficha{white-space:pre-wrap;background:#060b17;border:1px solid var(--line);border-radius:18px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.45}
.preview{max-width:100%;border-radius:16px;border:1px solid var(--line);margin-top:8px}
.hidden{display:none!important}
.status{display:flex;gap:8px;flex-wrap:wrap}
.status button{flex:1}
@media(max-width:650px){.form2{grid-template-columns:1fr}.card h2{font-size:25px}.brand h1{font-size:20px}.logo{width:52px;height:52px}}
</style>
</head>
<body>
<div id="auth" class="auth">
 <div class="login">
  <div class="logo">👑</div>
  <h1>Legacy Royal Stream</h1>
  <p style="color:var(--mut)">CRM + API V6</p>
  <label>Contraseña</label>
  <input id="pass" type="password" placeholder="royal2026">
  <button style="width:100%;margin-top:12px" onclick="login()">Entrar</button>
 </div>
</div>

<div id="app" class="app">
<header class="header">
 <div class="brand">
  <div class="logo">👑</div>
  <div><h1>Legacy Royal<br>Stream</h1><small>CRM + API V6 · Firebase</small></div>
 </div>
 <div class="tabs">
  <button class="active" onclick="show('dashboard',this)">Dashboard</button>
  <button onclick="show('venta',this)">Nueva venta</button>
  <button onclick="show('clientes',this)">Clientes</button>
  <button onclick="show('pedidos',this)">Pedidos</button>
  <button onclick="show('api',this)">API</button>
 </div>
</header>

<main class="main">
<section id="dashboard" class="section active">
 <div class="kpis">
  <div class="kpi"><span>Clientes</span><b id="kClientes">0</b></div>
  <div class="kpi"><span>Pedidos</span><b id="kPedidos">0</b></div>
  <div class="kpi"><span>Garantías activas</span><b id="kGarantias">0</b></div>
  <div class="kpi"><span>Hoy</span><b id="kHoy">0</b></div>
 </div>
 <div class="card">
  <h2>Centro de Operaciones</h2>
  <div id="dashList"></div>
 </div>
</section>

<section id="venta" class="section">
 <div class="card">
  <h2>Nueva venta</h2>
  <div class="form2">
   <div><label>Nombre</label><input id="nombre" value="Samuel CV"></div>
   <div><label>WhatsApp</label><input id="whatsapp" value="525619244751"></div>
   <div><label>Folio</label><input id="folio" readonly></div>
   <div><label>Generar folio</label><button class="ghost" style="width:100%" onclick="genFolio()">Generar</button></div>
   <div><label>Categoría</label><select id="categoria" onchange="loadProducts()"><option>Streaming</option><option>Trámites</option><option>Pago servicios</option><option>Seguidores</option></select></div>
   <div><label>Producto</label><select id="producto" onchange="loadModalidades()"></select></div>
   <div><label>Modalidad</label><select id="modalidad" onchange="updateAll()"></select></div>
   <div><label>Duración</label><select id="duracion" onchange="updateAll()"><option>1M</option><option selected>2M</option><option>3M</option><option>4M</option></select></div>
   <div><label>Proveedor</label><select id="proveedor" onchange="updateAll()"><option>DULITA</option><option>DARDO</option><option>COMODÍN</option></select></div>
   <div><label>Costo proveedor automático</label><input id="costo" readonly></div>
   <div><label>Monto recibido</label><input id="monto" type="number" value="100"></div>
   <div><label>Estado</label><select id="estado"><option>No entregado</option><option>Entregado</option></select></div>
   <div><label>Fecha entrega</label><input id="entrega" type="date" onchange="updateFicha()"></div>
   <div><label>Fecha vencimiento</label><input id="vencimiento" type="date" onchange="updateFicha()"></div>
   <div><label>Foto pago</label><input id="fotoPago" type="file" accept="image/*" capture="environment"><img id="prevPago" class="preview hidden"></div>
   <div><label>Foto garantía</label><input id="fotoGarantia" type="file" accept="image/*" capture="environment"><img id="prevGarantia" class="preview hidden"></div>
  </div>
 </div>
 <div class="card">
  <h2>Ficha</h2>
  <div id="ficha" class="ficha"></div>
  <div class="status" style="margin-top:10px">
   <button onclick="copyFicha()">Copiar</button>
   <button onclick="sendWA()">Enviar WhatsApp</button>
   <button class="ghost" onclick="saveSale()">Guardar</button>
  </div>
 </div>
</section>

<section id="clientes" class="section"><div class="card"><h2>Clientes</h2><div id="clientes"></div></div></section>
<section id="pedidos" class="section"><div class="card"><h2>Pedidos</h2><div id="pedidos"></div></div></section>
<section id="api" class="section"><div class="card"><h2>API</h2><div class="ficha">Base: /api

Garantía:
1M = 25 días
2M = 50 días
3M = 75 días

Fórmula:
meses × 25 días</div></div></section>
</main>
</div>

<script>
const DB='https://legacy-royal-stream-d2d38-default-rtdb.firebaseio.com/api';
const productos={
 'Streaming':['YouTube Premium','Spotify Premium','Netflix','Disney+','Max / HBO Max','Prime Video','Crunchyroll','Paramount','ViX'],
 'Trámites':['Acta de nacimiento'],
 'Pago servicios':['Pago de servicio'],
 'Seguidores':['Seguidores Instagram','Seguidores Facebook','Seguidores TikTok']
};
const costos={
 'DULITA':{'YouTube Premium':15,'Spotify Premium':15},
 'DARDO':{'Pago de servicio':0},
 'COMODÍN':{}
};
function login(){if(pass.value!=='royal2026')return alert('Contraseña incorrecta');auth.classList.add('hidden');app.style.display='block';init()}
function show(id,btn){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){if(!d)return'';let [y,m,da]=d.split('-');return `${da}-${m}-${y.slice(2)}`}
function meses(){return Number((duracion.value||'1M').replace(/\D/g,''))||1}
function garantiaDias(){return meses()*25}
function genFolio(){let d=new Date(),y=String(d.getFullYear()).slice(2),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');let code=producto.value.includes('YouTube')?'YT':producto.value.includes('Spotify')?'SP':'RY';folio.value=`${code}-${y}${m}${da}-001`;updateFicha()}
function loadProducts(){producto.innerHTML=productos[categoria.value].map(x=>`<option>${x}</option>`).join('');loadModalidades()}
function loadModalidades(){let p=producto.value;if(p.includes('YouTube')||p.includes('Spotify'))modalidad.innerHTML='<option>Individual Correo nuevo</option><option>Individual Invitación</option><option>Familiar</option>';else if(categoria.value==='Streaming')modalidad.innerHTML='<option>Perfil</option><option>Cuenta completa</option><option>Invitación</option>';else modalidad.innerHTML='<option>Servicio</option>';if(categoria.value==='Pago servicios')proveedor.value='DARDO';updateAll()}
function costoProveedor(){let base=(costos[proveedor.value]&&costos[proveedor.value][producto.value])||0;return base?base*meses():0}
function updateAll(){let c=costoProveedor();costo.value=c?('$'+c):'Según proveedor';updateFicha()}
function servicio(){let p=producto.value,d=duracion.value,mod=modalidad.value;if((p.includes('YouTube')||p.includes('Spotify'))&&mod.includes('Correo'))return `${p} Individual ${d}`;if((p.includes('YouTube')||p.includes('Spotify'))&&mod.includes('Invitación'))return `${p} Individual ${d}`;if((p.includes('YouTube')||p.includes('Spotify'))&&mod.includes('Familiar'))return `${p} Familiar ${d}`;if(categoria.value!=='Streaming')return p;return `${p} ${mod} ${d}`}
function acceso(){let m=modalidad.value;if(m.includes('Correo'))return 'Correo nuevo';if(m.includes('Invitación'))return 'Invitación';if(m.includes('Familiar'))return 'Familiar';return m}
function updateFicha(){ficha.textContent=`*📌 FICHA DE ENTREGA*

📱 Servicio: ${servicio()}
👥 Acceso asignado: ${acceso()}
📅 Fecha de entrega: ${fmt(entrega.value)}
📅 Fecha de vencimiento: ${fmt(vencimiento.value)}
🛡️ Garantía: ${garantiaDias()} días

*⚠️ POLÍTICAS Y CONDICIONES*

✅ La cuenta se entrega funcionando correctamente.
✅ El cliente cuenta con *1 hora a partir de la entrega* para verificar el acceso y confirmar que quedó funcionando; de lo contrario, se dará por recibida y aceptada y la garantía quedará anulada.
🚫 No cambiar contraseña ni configuración de la cuenta.
🚫 No compartir el acceso con más personas o dispositivos no autorizados.

*🔄 En caso de caída, bloqueo o cierre de sesión, la reposición o solución puede tardar hasta 72 horas.*

📌 Al recibir la cuenta, aceptas estas políticas y condiciones.`}
function copyFicha(){navigator.clipboard.writeText(ficha.textContent);alert('Ficha copiada')}
function sendWA(){estado.value='Entregado';window.open('https://wa.me/'+whatsapp.value+'?text='+encodeURIComponent(ficha.textContent),'_blank')}
function file64(el){return new Promise(r=>{let f=el.files[0];if(!f)return r('');let rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(f)})}
fotoPago.onchange=async()=>{let b=await file64(fotoPago);if(b){prevPago.src=b;prevPago.classList.remove('hidden')}}
fotoGarantia.onchange=async()=>{let b=await file64(fotoGarantia);if(b){prevGarantia.src=b;prevGarantia.classList.remove('hidden')}}
async function api(path,method='GET',body=null){let opt={method,headers:{'Content-Type':'application/json'}};if(body)opt.body=JSON.stringify(body);let r=await fetch(DB+'/'+path+'.json',opt);return r.json()}
async function saveSale(){if(!fotoPago.files[0])return alert('Falta foto de pago');if(!fotoGarantia.files[0])return alert('Falta foto de garantía');if(!folio.value)genFolio();let pedido={folio:folio.value,cliente:nombre.value,whatsapp:whatsapp.value,producto:producto.value,modalidad:modalidad.value,duracion:duracion.value,montoRecibido:Number(monto.value||0),costoProveedor:costoProveedor(),proveedorUsado:proveedor.value,estado:estado.value,fecha:entrega.value,vencimiento:vencimiento.value,diasGarantia:garantiaDias(),fichaEntrega:ficha.textContent,comprobantePago:await file64(fotoPago),fotoGarantia:await file64(fotoGarantia)};await api('clientes/'+whatsapp.value,'PATCH',{nombre:nombre.value,whatsapp:whatsapp.value,nivelConfianza:'nuevo'});await api('pedidos/'+folio.value,'PUT',pedido);await api('garantias/'+folio.value,'PUT',{folio:folio.value,whatsapp:whatsapp.value,estado:'Activa',diasGarantia:garantiaDias(),fotoGarantia:pedido.fotoGarantia});alert('Guardado');render()}
async function render(){let c=await api('clientes')||{},p=await api('pedidos')||{},g=await api('garantias')||{};kClientes.textContent=Object.keys(c).length;kPedidos.textContent=Object.keys(p).length;kGarantias.textContent=Object.keys(g).length;kHoy.textContent=Object.values(p).filter(x=>x.fecha===today()).length;dashList.innerHTML=Object.values(p).slice(-5).reverse().map(x=>`<div class=row><b>${x.folio}</b><br><small>${x.cliente} · ${x.producto} · Garantía ${x.diasGarantia} días</small></div>`).join('')||'<small>No hay movimientos.</small>';clientes.innerHTML=Object.values(c).map(x=>`<div class=row><b>${x.nombre}</b><br><small>${x.whatsapp}</small></div>`).join('')||'<small>Sin clientes.</small>';pedidos.innerHTML=Object.values(p).map(x=>`<div class=row><b>${x.folio}</b><br><small>${x.cliente} · ${x.producto} · ${x.duracion} · $${x.costoProveedor}</small></div>`).join('')||'<small>Sin pedidos.</small>'}
function init(){entrega.value=today();loadProducts();genFolio();render()}
</script>
</body>
</html>

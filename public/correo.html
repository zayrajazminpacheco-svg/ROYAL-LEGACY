<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta
    name="theme-color"
    content="#070817"
  >

  <title>
    Mi correo | Legacy Royal Stream
  </title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #050610;
      --panel: #0e1222;
      --panel2: #151a30;
      --line: #ffffff18;
      --text: #f8f9ff;
      --muted: #a6aec7;
      --cyan: #4cecff;
      --violet: #b45bff;
      --green: #62efad;
      --red: #ff6a82;
      --gold: #f6d475;
      --shadow: 0 26px 80px rgba(0, 0, 0, .48);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 8% 2%,
          rgba(171, 70, 255, .22),
          transparent 31%
        ),
        radial-gradient(
          circle at 92% 14%,
          rgba(47, 222, 255, .16),
          transparent 29%
        ),
        linear-gradient(
          180deg,
          #050610,
          #090c19 52%,
          #050610
        );
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color:
        transparent;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .shell {
      width: min(920px, calc(100% - 28px));
      margin: auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 6, 16, .78);
      backdrop-filter: blur(22px);
    }

    .nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 950;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      font-size: 23px;
      background:
        linear-gradient(
          145deg,
          var(--violet),
          #627cff 58%,
          var(--cyan)
        );
      box-shadow:
        0 0 28px rgba(100, 91, 255, .42);
    }

    .brand small {
      display: block;
      margin-top: 3px;
      color: var(--cyan);
      font-size: 10px;
      letter-spacing: .15em;
    }

    .ghost,
    .primary,
    .mini {
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      font-weight: 850;
    }

    .ghost {
      padding: 10px 13px;
      background: #ffffff0b;
    }

    .primary {
      min-height: 50px;
      padding: 12px 18px;
      border: 0;
      color: #06111a;
      background:
        linear-gradient(
          135deg,
          var(--violet),
          var(--cyan)
        );
      box-shadow:
        0 14px 34px rgba(83, 134, 255, .24);
    }

    .primary:disabled {
      opacity: .6;
      cursor: wait;
    }

    main {
      padding: 42px 0 70px;
    }

    .login-wrap {
      min-height: calc(100vh - 180px);
      display: grid;
      place-items: center;
    }

    .login-card,
    .message-card,
    .summary {
      border: 1px solid var(--line);
      background:
        linear-gradient(
          155deg,
          rgba(20, 25, 48, .96),
          rgba(9, 12, 27, .96)
        );
      box-shadow: var(--shadow);
    }

    .login-card {
      width: min(480px, 100%);
      padding: 28px;
      border-radius: 26px;
    }

    .eyebrow {
      color: var(--cyan);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(29px, 7vw, 42px);
      line-height: 1.05;
    }

    .muted {
      color: var(--muted);
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      color: #dfe4f5;
      font-size: 13px;
      font-weight: 850;
    }

    input {
      width: 100%;
      min-height: 52px;
      padding: 13px 15px;
      border: 1px solid #ffffff1f;
      border-radius: 15px;
      outline: none;
      color: var(--text);
      background: #080c1a;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow:
        0 0 0 4px rgba(76, 236, 255, .1);
    }

    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 76px;
    }

    .password-field button {
      position: absolute;
      right: 7px;
      top: 7px;
      bottom: 7px;
      border: 0;
      border-radius: 10px;
      color: var(--cyan);
      font-weight: 850;
      background: #ffffff0c;
    }

    .login-card .primary {
      width: 100%;
      margin-top: 22px;
    }

    .notice {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 13px;
      line-height: 1.45;
    }

    .notice.show {
      display: block;
    }

    .notice.error {
      color: #ffd7de;
      border: 1px solid rgba(255, 106, 130, .32);
      background: rgba(255, 106, 130, .11);
    }

    .inbox-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
      margin-bottom: 22px;
    }

    .inbox-head h1 {
      margin-bottom: 7px;
    }

    .mail-address {
      color: var(--cyan);
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .head-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      overflow: hidden;
      margin-bottom: 18px;
      border-radius: 20px;
    }

    .summary div {
      padding: 18px;
      text-align: center;
      background: rgba(10, 14, 29, .85);
    }

    .summary strong {
      display: block;
      margin-bottom: 3px;
      font-size: 25px;
    }

    .summary span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .message-list {
      display: grid;
      gap: 13px;
    }

    .message-card {
      padding: 19px;
      border-radius: 20px;
    }

    .message-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .platform {
      display: inline-flex;
      padding: 5px 9px;
      border: 1px solid rgba(76, 236, 255, .25);
      border-radius: 999px;
      color: var(--cyan);
      background: rgba(76, 236, 255, .08);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .date {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .subject {
      margin: 13px 0 6px;
      font-size: 18px;
      font-weight: 900;
    }

    .sender,
    .preview {
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .sender {
      font-size: 12px;
    }

    .preview {
      margin: 14px 0 0;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .code-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding: 13px 14px;
      border: 1px solid rgba(98, 239, 173, .25);
      border-radius: 15px;
      background: rgba(98, 239, 173, .08);
    }

    .code-box span {
      color: var(--green);
      font-size: 12px;
      font-weight: 850;
    }

    .code-box strong {
      display: block;
      margin-top: 3px;
      font-size: 23px;
      letter-spacing: .08em;
    }

    .mini {
      padding: 8px 11px;
      background: #ffffff0b;
    }

    .message-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 9px 13px;
      border: 1px solid rgba(180, 91, 255, .35);
      border-radius: 12px;
      color: #f4dcff;
      font-weight: 850;
      text-decoration: none;
      background: rgba(180, 91, 255, .12);
    }

    .empty {
      padding: 42px 20px;
      border: 1px dashed #ffffff25;
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
    }

    .loading {
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .45;
      }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 20px, 920px);
      }

      .brand-name {
        font-size: 13px;
      }

      main {
        padding-top: 24px;
      }

      .login-card {
        padding: 22px 17px;
      }

      .inbox-head {
        align-items: stretch;
        flex-direction: column;
      }

      .head-actions button {
        flex: 1;
      }

      .summary div {
        padding: 13px 6px;
      }

      .summary strong {
        font-size: 21px;
      }

      .message-card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="shell nav">
      <div class="brand">
        <div class="brand-mark">♛</div>
        <div class="brand-name">
          LEGACY ROYAL
          <small>MI CORREO PRIVADO</small>
        </div>
      </div>

      <a class="ghost" href="/tienda">
        Ir a la tienda
      </a>
    </div>
  </header>

  <main class="shell">
    <section
      id="loginView"
      class="login-wrap"
    >
      <form
        id="loginForm"
        class="login-card"
      >
        <div class="eyebrow">
          Acceso exclusivo
        </div>

        <h1>Abre tu correo</h1>

        <p class="muted">
          Consulta los códigos, PIN y mensajes
          nuevos recibidos después de tu compra.
          Los correos internos anteriores están
          protegidos y no aparecen aquí.
        </p>

        <label for="emailInput">
          Correo generado
        </label>

        <input
          id="emailInput"
          type="email"
          inputmode="email"
          autocomplete="username"
          placeholder="correo@tudominio.com"
          required
        >

        <label for="passwordInput">
          Contraseña del correo
        </label>

        <div class="password-field">
          <input
            id="passwordInput"
            type="password"
            autocomplete="current-password"
            placeholder="RL-••••-••••-••••"
            required
          >

          <button
            type="button"
            onclick="togglePassword()"
          >
            Ver
          </button>
        </div>

        <button
          id="loginButton"
          class="primary"
          type="submit"
        >
          Abrir mi correo
        </button>

        <div
          id="loginNotice"
          class="notice"
        ></div>
      </form>
    </section>

    <section
      id="inboxView"
      class="hidden"
    >
      <div class="inbox-head">
        <div>
          <div class="eyebrow">
            Bandeja privada
          </div>
          <h1>Mis mensajes</h1>
          <div
            id="currentEmail"
            class="mail-address"
          ></div>
        </div>

        <div class="head-actions">
          <button
            class="ghost"
            type="button"
            onclick="loadMessages()"
          >
            Actualizar
          </button>

          <button
            class="ghost"
            type="button"
            onclick="logout()"
          >
            Cerrar sesión
          </button>
        </div>
      </div>

      <div class="summary">
        <div>
          <strong id="messageCount">0</strong>
          <span>Mensajes</span>
        </div>
        <div>
          <strong id="codeCount">0</strong>
          <span>Códigos</span>
        </div>
        <div>
          <strong id="linkCount">0</strong>
          <span>Enlaces</span>
        </div>
      </div>

      <div
        id="messageList"
        class="message-list"
      ></div>
    </section>
  </main>

  <script>
    const API =
      '/api/mailbox';

    let mailboxToken =
      sessionStorage.getItem(
        'royalMailboxToken'
      ) || '';

    let currentMailbox =
      null;

    let refreshTimer =
      null;

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function extractData(json) {
      return json?.data !== undefined
        ? json.data
        : json;
    }

    async function request(
      path,
      options = {},
      authenticated = false
    ) {
      const headers = {
        ...(options.headers || {})
      };

      if (
        options.body &&
        !(options.body instanceof FormData)
      ) {
        headers['Content-Type'] =
          'application/json';
      }

      if (
        authenticated &&
        mailboxToken
      ) {
        headers.Authorization =
          `Bearer ${mailboxToken}`;
      }

      const response =
        await fetch(
          `${API}${path}`,
          {
            ...options,
            headers
          }
        );

      let json;

      try {
        json =
          await response.json();
      } catch {
        json = {
          success: false,
          message:
            'El servidor devolvió una respuesta no válida'
        };
      }

      if (!response.ok) {
        const error =
          new Error(
            json.message ||
            'No fue posible completar la solicitud'
          );

        error.status =
          response.status;

        throw error;
      }

      return json;
    }

    function showLoginNotice(message) {
      const notice =
        document.getElementById(
          'loginNotice'
        );

      notice.textContent =
        message || '';

      notice.className =
        message
          ? 'notice show error'
          : 'notice';
    }

    function togglePassword() {
      const input =
        document.getElementById(
          'passwordInput'
        );

      input.type =
        input.type === 'password'
          ? 'text'
          : 'password';
    }

    function showInbox(mailbox) {
      currentMailbox =
        mailbox;

      document
        .getElementById('loginView')
        .classList.add('hidden');

      document
        .getElementById('inboxView')
        .classList.remove('hidden');

      document
        .getElementById('currentEmail')
        .textContent =
          mailbox?.email || '';

      if (refreshTimer) {
        clearInterval(
          refreshTimer
        );
      }

      refreshTimer =
        setInterval(
          loadMessages,
          30000
        );
    }

    function showLogin() {
      document
        .getElementById('inboxView')
        .classList.add('hidden');

      document
        .getElementById('loginView')
        .classList.remove('hidden');

      if (refreshTimer) {
        clearInterval(
          refreshTimer
        );

        refreshTimer =
          null;
      }
    }

    function logout() {
      mailboxToken = '';
      currentMailbox = null;

      sessionStorage.removeItem(
        'royalMailboxToken'
      );

      showLogin();
      showLoginNotice('');

      document
        .getElementById('passwordInput')
        .value = '';
    }

    function safeLink(value) {
      try {
        const url =
          new URL(value);

        return [
          'http:',
          'https:'
        ].includes(url.protocol)
          ? url.href
          : '';
      } catch {
        return '';
      }
    }

    function textFromStoredMessage(message) {
      const stored =
        String(
          message?.bodyEncrypted ||
          message?.bodyPreview ||
          ''
        );

      if (!stored) {
        return '';
      }

      if (/<[a-z][\s\S]*>/i.test(stored)) {
        const documentValue =
          new DOMParser()
            .parseFromString(
              stored,
              'text/html'
            );

        return String(
          documentValue.body
            ?.textContent ||
          ''
        )
          .replace(/\s+/g, ' ')
          .trim()
          .slice(0, 900);
      }

      return stored
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 900);
    }

    async function copyValue(value) {
      try {
        await navigator.clipboard
          .writeText(
            String(value || '')
          );
      } catch {
        const area =
          document.createElement(
            'textarea'
          );

        area.value =
          String(value || '');
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
    }

    function formatDate(value) {
      if (!value) {
        return '';
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return '';
      }

      return date.toLocaleString(
        'es-MX',
        {
          dateStyle: 'medium',
          timeStyle: 'short'
        }
      );
    }

    function renderMessages(messages) {
      const list =
        Array.isArray(messages)
          ? messages
          : [];

      const codes =
        list.filter(
          message =>
            message.verificationCode ||
            message.code
        ).length;

      const links =
        list.filter(
          message =>
            safeLink(
              message.primaryLink
            )
        ).length;

      document
        .getElementById('messageCount')
        .textContent =
          list.length;

      document
        .getElementById('codeCount')
        .textContent =
          codes;

      document
        .getElementById('linkCount')
        .textContent =
          links;

      const container =
        document.getElementById(
          'messageList'
        );

      if (!list.length) {
        container.innerHTML = `
          <div class="empty">
            Aún no hay mensajes para este correo.
            La bandeja se actualiza automáticamente.
          </div>
        `;
        return;
      }

      container.innerHTML =
        list.map(
          message => {
            const code =
              message.verificationCode ||
              message.code ||
              '';

            const link =
              safeLink(
                message.primaryLink
              );

            const preview =
              textFromStoredMessage(
                message
              );

            return `
              <article class="message-card">
                <div class="message-top">
                  <span class="platform">
                    ${escapeHtml(
                      message.platform ||
                      'Correo'
                    )}
                  </span>

                  <span class="date">
                    ${escapeHtml(
                      formatDate(
                        message.receivedAt ||
                        message.createdAt
                      )
                    )}
                  </span>
                </div>

                <div class="subject">
                  ${escapeHtml(
                    message.subject ||
                    'Mensaje recibido'
                  )}
                </div>

                <div class="sender">
                  De: ${escapeHtml(
                    message.sender ||
                    'Remitente desconocido'
                  )}
                </div>

                ${
                  code
                    ? `
                      <div class="code-box">
                        <div>
                          <span>Código recibido</span>
                          <strong>${escapeHtml(code)}</strong>
                        </div>
                        <button
                          class="mini"
                          type="button"
                          data-copy-code="${escapeHtml(code)}"
                        >
                          Copiar
                        </button>
                      </div>
                    `
                    : ''
                }

                ${
                  preview
                    ? `
                      <p class="preview">
                        ${escapeHtml(preview)}
                      </p>
                    `
                    : ''
                }

                ${
                  link
                    ? `
                      <div class="message-actions">
                        <a
                          class="link-btn"
                          href="${escapeHtml(link)}"
                          target="_blank"
                          rel="noopener noreferrer"
                        >
                          Abrir enlace correcto
                        </a>
                      </div>
                    `
                    : ''
                }
              </article>
            `;
          }
        ).join('');

      container
        .querySelectorAll(
          '[data-copy-code]'
        )
        .forEach(
          button => {
            button.addEventListener(
              'click',
              () =>
                copyValue(
                  button.dataset
                    .copyCode
                )
            );
          }
        );
    }

    async function loadMessages() {
      const container =
        document.getElementById(
          'messageList'
        );

      if (!mailboxToken) {
        showLogin();
        return;
      }

      if (!container.children.length) {
        container.innerHTML = `
          <div class="empty loading">
            Cargando mensajes...
          </div>
        `;
      }

      try {
        const json =
          await request(
            '/messages',
            {},
            true
          );

        renderMessages(
          extractData(json)
        );
      } catch (error) {
        if (error.status === 401) {
          logout();
          showLoginNotice(
            error.message
          );
          return;
        }

        container.innerHTML = `
          <div class="empty">
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    document
      .getElementById('loginForm')
      .addEventListener(
        'submit',
        async event => {
          event.preventDefault();
          showLoginNotice('');

          const button =
            document.getElementById(
              'loginButton'
            );

          button.disabled =
            true;
          button.textContent =
            'Abriendo...';

          try {
            const json =
              await request(
                '/login',
                {
                  method: 'POST',
                  body: JSON.stringify({
                    email:
                      document
                        .getElementById(
                          'emailInput'
                        )
                        .value,
                    password:
                      document
                        .getElementById(
                          'passwordInput'
                        )
                        .value
                  })
                }
              );

            const data =
              extractData(json);

            mailboxToken =
              data.token;

            sessionStorage.setItem(
              'royalMailboxToken',
              mailboxToken
            );

            showInbox(
              data.mailbox
            );

            await loadMessages();
          } catch (error) {
            showLoginNotice(
              error.message
            );
          } finally {
            button.disabled =
              false;
            button.textContent =
              'Abrir mi correo';
          }
        }
      );

    async function initialize() {
      const email =
        new URLSearchParams(
          location.search
        ).get('email');

      if (email) {
        document
          .getElementById('emailInput')
          .value =
            email;
      }

      if (!mailboxToken) {
        showLogin();
        return;
      }

      try {
        const json =
          await request(
            '/me',
            {},
            true
          );

        showInbox(
          extractData(json)
        );

        await loadMessages();
      } catch {
        logout();
      }
    }

    initialize();
  </script>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Legacy Stream</title>
<style>
:root{--bg:#050711;--card:#10182b;--txt:#f8fbff;--mut:#a9b6c8;--gold:#f7c85f;--blue:#49b9ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#15213d,#050711 64%);color:var(--txt);display:grid;place-items:center;padding:20px}.card{max-width:520px;width:100%;background:linear-gradient(180deg,rgba(16,24,43,.96),rgba(7,11,23,.98));border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:28px;box-shadow:0 22px 70px rgba(0,0,0,.35)}.logo{width:62px;height:62px;border-radius:21px;background:linear-gradient(135deg,var(--gold),var(--blue));display:grid;place-items:center;font-size:28px;margin-bottom:14px}h1{margin:0 0 8px;font-size:31px}p{color:var(--mut);line-height:1.55}.btn{display:inline-block;margin-top:14px;padding:13px 16px;border-radius:15px;background:linear-gradient(135deg,var(--gold),var(--blue));color:#05101f;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<div class="card"><div class="logo">👑</div><h1>Royal Legacy Stream</h1><p>La plataforma para clientes está en mantenimiento mientras mejoramos el sistema interno.</p><p>Por ahora las compras y entregas se atienden por WhatsApp.</p><a class="btn" href="admin.html">Entrar al panel interno</a></div>
</body>
</html>

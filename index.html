<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legacy Royal Stream</title>
<style>
:root{--bg:#050711;--card:#101827;--line:rgba(255,255,255,.12);--txt:#f8fbff;--mut:#9aa8bd;--gold:#f6c65b;--blue:#60a5fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,rgba(96,165,250,.22),transparent 35%),linear-gradient(140deg,#03050d,#07111f 56%,#04050d);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:18px}.card{max-width:520px;background:rgba(16,24,39,.94);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.4)}.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--gold),var(--blue));display:grid;place-items:center;font-size:30px;margin-bottom:14px}h1{margin:0 0 8px;font-size:30px}p{color:var(--mut);line-height:1.5}.btn{display:inline-flex;margin-top:12px;text-decoration:none;color:#06101f;background:linear-gradient(135deg,var(--gold),var(--blue));font-weight:900;border-radius:16px;padding:13px 16px}</style>
</head>
<body><main class="card"><div class="logo">👑</div><h1>Legacy Royal Stream</h1><p>La plataforma para clientes está en mantenimiento mientras se mejora el CRM interno.</p><p>Compras, reportes y atención se manejan por WhatsApp.</p><a class="btn" href="admin.html">Entrar al CRM</a></main></body>
</html>
